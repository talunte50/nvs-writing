# 部署 nvs-writing 到 Cloudflare Workers
# 触发：push 到 main/master，或手动 "Run workflow"
name: Deploy

on:
  push:
    branches: [main, master]
    paths:
      - "worker.js"
      - "schema.sql"
      - ".github/scripts/ensure-resources.mjs"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-nvs-writing-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24：node:sqlite（test-local 的 D1 mock）免实验标志；Node 20/22 需 --experimental-sqlite
          node-version: 24

      - name: Precheck (worker 本体 + 内嵌浏览器 JS 双语法校验)
        run: node precheck.mjs worker.js

      - name: Local regression (mock D1 + mock LLM，26 项断言)
        run: node test-local.mjs worker.js

      - name: Ensure D1 + apply schema
        run: node .github/scripts/ensure-resources.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.local.toml --no-bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LLM_KEY: ${{ secrets.LLM_KEY }}
